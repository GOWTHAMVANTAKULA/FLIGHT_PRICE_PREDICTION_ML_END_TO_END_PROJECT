<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Price Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 30px auto;
        }
        h1, h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"],
        input[type="number"],
        input[type="date"],
        select {
            width: calc(100% - 22px);
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            margin-top: 3px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .prediction-result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #28a745;
            border-radius: 4px;
            background-color: #e2f9e7;
            color: #155724;
            text-align: center;
            font-size: 1.1em;
            font-weight: bold;
        }
        .error-message-display {
            color: red;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Flight Price Predictor</h1>
        <form action="/predict" method="POST">
            <div class="form-group">
                <label for="from">From:</label>
                <select id="from" name="from" required>
                    <option value="">Select origin</option>
                    <option value="Recife (PE)" {% if form_data.from == 'Recife (PE)' %}selected{% endif %}>Recife (PE)</option>
                    <option value="Florianopolis (SC)" {% if form_data.from == 'Florianopolis (SC)' %}selected{% endif %}>Florianopolis (SC)</option>
                    <option value="Brasilia (DF)" {% if form_data.from == 'Brasilia (DF)' %}selected{% endif %}>Brasilia (DF)</option>
                    <option value="Aracaju (SE)" {% if form_data.from == 'Aracaju (SE)' %}selected{% endif %}>Aracaju (SE)</option>
                    <option value="Salvador (BH)" {% if form_data.from == 'Salvador (BH)' %}selected{% endif %}>Salvador (BH)</option>
                    <option value="Campo Grande (MS)" {% if form_data.from == 'Campo Grande (MS)' %}selected{% endif %}>Campo Grande (MS)</option>
                    <option value="Sao Paulo (SP)" {% if form_data.from == 'Sao Paulo (SP)' %}selected{% endif %}>Sao Paulo (SP)</option>
                    <option value="Natal (RN)" {% if form_data.from == 'Natal (RN)' %}selected{% endif %}>Natal (RN)</option>
                    <option value="Rio de Janeiro (RJ)" {% if form_data.from == 'Rio de Janeiro (RJ)' %}selected{% endif %}>Rio de Janeiro (RJ)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="to">To:</label>
                <select id="to" name="to" required>
                    <option value="">Select destination</option>
                    <option value="Florianopolis (SC)" {% if form_data.to == 'Florianopolis (SC)' %}selected{% endif %}>Florianopolis (SC)</option>
                    <option value="Recife (PE)" {% if form_data.to == 'Recife (PE)' %}selected{% endif %}>Recife (PE)</option>
                    <option value="Brasilia (DF)" {% if form_data.to == 'Brasilia (DF)' %}selected{% endif %}>Brasilia (DF)</option>
                    <option value="Salvador (BH)" {% if form_data.to == 'Salvador (BH)' %}selected{% endif %}>Salvador (BH)</option>
                    <option value="Aracaju (SE)" {% if form_data.to == 'Aracaju (SE)' %}selected{% endif %}>Aracaju (SE)</option>
                    <option value="Campo Grande (MS)" {% if form_data.to == 'Campo Grande (MS)' %}selected{% endif %}>Campo Grande (MS)</option>
                    <option value="Sao Paulo (SP)" {% if form_data.to == 'Sao Paulo (SP)' %}selected{% endif %}>Sao Paulo (SP)</option>
                    <option value="Natal (RN)" {% if form_data.to == 'Natal (RN)' %}selected{% endif %}>Natal (RN)</option>
                    <option value="Rio de Janeiro (RJ)" {% if form_data.to == 'Rio de Janeiro (RJ)' %}selected{% endif %}>Rio de Janeiro (RJ)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="flightType">Flight Type:</label>
                <select id="flightType" name="flightType" required>
                    <option value="">Select flight type</option>
                    <option value="firstClass" {% if form_data.flightType == 'firstClass' %}selected{% endif %}>First Class</option>
                    <option value="economic" {% if form_data.flightType == 'economic' %}selected{% endif %}>Economic</option>
                    <option value="premium" {% if form_data.flightType == 'premium' %}selected{% endif %}>Premium</option>
                </select>
            </div>

            <div class="form-group">
                <label for="time">Travel Time (hours):</label>
                <input type="number" id="time" name="time" step="0.01" value="{{ form_data.time if form_data.time else '' }}" required>
            </div>

            <div class="form-group">
                <label for="distance">Distance (km):</label>
                <input type="number" id="distance" name="distance" step="0.01" value="{{ form_data.distance if form_data.distance else '' }}" required>
            </div>

            <div class="form-group">
                <label for="agency">Agency:</label>
                <select id="agency" name="agency" required>
                    <option value="">Select agency</option>
                    <option value="FlyingDrops" {% if form_data.agency == 'FlyingDrops' %}selected{% endif %}>FlyingDrops</option>
                    <option value="CloudFy" {% if form_data.agency == 'CloudFy' %}selected{% endif %}>CloudFy</option>
                    <option value="Rainbow" {% if form_data.agency == 'Rainbow' %}selected{% endif %}>Rainbow</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" value="{{ form_data.date if form_data.date else '' }}" required>
            </div>

            <button type="submit">Get Prediction</button>
        </form>

        {% if predicted_price %}
            <div class="prediction-result">
                Predicted Flight Price: ${{ predicted_price }}
            </div>
        {% endif %}

        {% if error_message %}
            <div class="error-message-display">
                Error: {{ error_message }}
            </div>
        {% endif %}

    </div>
</body>
</html>
